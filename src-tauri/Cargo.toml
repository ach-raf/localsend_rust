[package]
name = "local-share"
version = "0.2.0"
description = "Local Share - Share files and messages over local network"
authors = ["ach-raf"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "local_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
axum = { version = "0.8.9", features = ["multipart"] }
# Using reqwest through tauri-plugin-http instead
# reqwest = { version = "0.12", default-features = false, features = [
#     "json",
#     "multipart",
#     "stream",
#     "rustls-tls",
# ] }
mdns-sd = "0.20.2"
tokio = { version = "1.53.1", features = ["full"] }
local-ip-address = "0.6.13"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-http = { version = "2.5.9", features = ["multipart"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace", "limit"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
once_cell = "1.21.4"
hostname = "0.4.2"
flume = "0.12.0"
urlencoding = "2.1"
url = "2.5.8"
infer = "0.22.0"
tokio-util = { version = "0.7.19", features = ["codec", "io"] }
futures = "0.3.33"
tauri-plugin-android-fs = { version = "29.0.0", features = [
    "legacy_storage_permission",
] }
tauri-plugin-upload = "2.4.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-android-share-target = { git = "https://github.com/ach-raf/tauri-plugin-android-share-target.git", rev = "4f1c552360f66d576867d979096c8738dc67c51c" }
