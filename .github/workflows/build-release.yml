name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Every push to the same ref cancels the in-flight run and starts a fresh one,
# so rapid commits don't queue up redundant Windows + Android builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri App for Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          retryAttempts: 3
          args: --target x86_64-pc-windows-msvc

      - name: Create Portable Windows ZIP
        # The standalone .exe is fully self-contained (Tauri bundles the
        # WebView loader and all runtime deps into the binary), so it is the
        # portable build. Zip it up alongside the installers.
        # Note: the raw binary in target/release is named after the *Cargo
        # package name* (local-share.exe), not the productName ("Local Share"),
        # which only governs the MSI/NSIS installer names.
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $exe = Join-Path $releaseDir "local-share.exe"
          # Fallback: take any top-level .exe in release/ (Get-ChildItem is
          # non-recursive, so ./bundle installers are excluded automatically)
          # in case the Cargo package is renamed again.
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem -Path $releaseDir -Filter *.exe -File |
                    Select-Object -First 1).FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) {
            throw "Portable .exe not found under: $releaseDir"
          }
          Write-Host "Packaging portable exe: $exe"
          Compress-Archive -Path $exe -DestinationPath "Local-Share-portable-x86_64.zip" -Force
          Write-Host "Created Local-Share-portable-x86_64.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*
            Local-Share-portable-x86_64.zip
          retention-days: 30

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        # Tauri 2.x requires webkit2gtk-4.1 (not 4.0) plus the GTK/appindicator
        # toolchain to compile, and patchelf for AppImage bundling. Pinned to
        # ubuntu-22.04 so the webkit2gtk-4.1 package is the one present at build
        # time (newer Ubuntu shipped a different abi split).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri App for Linux
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          retryAttempts: 3
          # Native x86_64 only (mirrors the Windows x86_64-only target). No
          # --target → builds for the runner's host triple (x86_64-unknown-linux-gnu).
          # Produces .deb / .rpm / .AppImage under target/release/bundle/.

      - name: List Built Linux Packages
        run: |
          echo "=== Linux bundles ==="
          find src-tauri/target/release/bundle -type f | sort

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: src-tauri/target/release/bundle/**/*
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      - name: Add Rust Android Targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Setup Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p src-tauri/gen/android/app
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using production keystore from secrets"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/upload-keystore.jks
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > src-tauri/gen/android/key.properties
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> src-tauri/gen/android/key.properties
            echo "keyAlias=$ANDROID_KEY_ALIAS" >> src-tauri/gen/android/key.properties
            echo "storeFile=upload-keystore.jks" >> src-tauri/gen/android/key.properties
          else
            echo "Creating debug keystore (secrets not found)"
            keytool -genkey -v \
              -keystore src-tauri/gen/android/app/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass android \
              -keypass android \
              -dname "CN=Local Share, OU=Development, O=MyCompany, L=City, S=State, C=US"
            echo "storePassword=android" > src-tauri/gen/android/key.properties
            echo "keyPassword=android" >> src-tauri/gen/android/key.properties
            echo "keyAlias=upload" >> src-tauri/gen/android/key.properties
            echo "storeFile=upload-keystore.jks" >> src-tauri/gen/android/key.properties
          fi

      - name: Build Android APKs
        # Build twice from one Rust compilation:
        #   1. a universal APK (one download installs on any device), then
        #   2. per-ABI APKs (smaller, architecture-specific downloads).
        # The second run reuses the already-compiled Rust targets, so it
        # only re-packages — Gradle's incremental cache keeps it fast.
        run: |
          npx tauri android build --apk
          npx tauri android build --split-per-abi --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: List Built APK Files
        run: |
          echo "=== APK files ==="
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | sort

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  create-release:
    name: Create Combined Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    # Every push to master builds and publishes a fresh, real (non-pre-)
    # release. Each release gets a unique tag so they pile up as history.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch enough history to list the new commits in this push in the
          # release notes. 0 = full history; cheap on Linux.
          fetch-depth: 0

      - name: Build release tag and name
        id: meta
        shell: bash
        run: |
          # Unique, sortable tag per push: vYYYY.MM.DD-<run>. The run number
          # disambiguates multiple pushes on the same day.
          STAMP=$(date -u +'%Y.%m.%d')
          TAG="v${STAMP}-${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Local Share ${TAG}" >> "$GITHUB_OUTPUT"
          echo "Will publish release: ${TAG}"

      - name: Generate release notes from new commits
        id: changelog
        shell: bash
        run: |
          # Default branch HEAD before this push (the parent of the pushed
          # commit) is the natural start of the range. Fall back to a small
          # window if it isn't available (e.g. very first run).
          RANGE="${{ github.event.before }}..${{ github.event.after }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="HEAD~10..HEAD"
            echo "No usable 'before' sha; falling back to $RANGE" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "## What changed"
            echo ""
            # Pretty list of the commit messages pushed in this run.
            git log "${RANGE}" --pretty=format:"- %s" --no-merges 2>/dev/null || echo "- (no commit log available)"
            echo ""
            echo ""
            echo "## Downloads"
            echo ""
            echo "**Windows**"
            echo "- \`*.msi\` / \`*setup.exe\` — installers"
            echo "- \`Local-Share-portable-x86_64.zip\` — portable, extract and run"
            echo ""
            echo "**Android**"
            echo "- \`*-android-universal.apk\` — works on any device (larger)"
            echo "- \`*-android-arm64-v8a.apk\` — 64-bit ARM (most modern phones)"
            echo "- \`*-android-armeabi-v7a.apk\` — 32-bit ARM (older phones)"
            echo "- \`*-android-x86_64.apk\` — Intel/AMD 64-bit (emulators, some tablets)"
            echo "- \`*-android-x86.apk\` — Intel/AMD 32-bit (emulators)"
            echo ""
            echo "**Linux (x86_64)**"
            echo "- \`*-linux-amd64.deb\` — Debian/Ubuntu (double-click to install)"
            echo "- \`*-linux-x86_64.rpm\` — Fedora/RHEL/openSUSE"
            echo "- \`*-linux-x86_64.AppImage\` — universal, portable (chmod +x and run)"
            echo ""
            echo "---"
            echo "Built from commit \`${GITHUB_SHA::7}\` on \`master\`."
          } > release_notes.md
          echo "Notes preview:" >> "$GITHUB_STEP_SUMMARY"
          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: ./artifacts/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/android

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: ./artifacts/linux

      - name: Rename artifacts to clean names
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # Flatten everything into one folder with clean, consistent names so
          # the release page shows one tidy asset per platform.
          mkdir -p ./artifacts/out
          cp ./artifacts/windows/Local-Share-portable-x86_64.zip \
             "./artifacts/out/Local-Share-${TAG}-portable-x86_64.zip" 2>/dev/null || true
          find ./artifacts/windows -name "*.msi" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-x64.msi" 2>/dev/null || true
          find ./artifacts/windows -name "*setup*.exe" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-x64-setup.exe" 2>/dev/null || true

          # Android: one per-ABI APK per device architecture, plus a universal
          # APK for anyone who doesn't know their ABI. Pick each by its
          # parent directory so an ABI mismatch (e.g. app-universal-release vs
          # app-arm64-release) can't land in the wrong bucket.
          find ./artifacts/android -path "*universal*" -name "*.apk" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-android-universal.apk" 2>/dev/null || true
          find ./artifacts/android -path "*arm64*" -name "*.apk" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-android-arm64-v8a.apk" 2>/dev/null || true
          find ./artifacts/android -path "*arm*" -name "*.apk" -not -path "*arm64*" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-android-armeabi-v7a.apk" 2>/dev/null || true
          find ./artifacts/android -path "*x86_64*" -name "*.apk" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-android-x86_64.apk" 2>/dev/null || true
          find ./artifacts/android -path "*x86*" -name "*.apk" -not -path "*x86_64*" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-android-x86.apk" 2>/dev/null || true

          # Linux: one asset per package format. All are x86_64 (the only
          # target this job builds). Pick by extension under the per-format
          # bundle directory Tauri emits (deb/, rpm/, appimage/).
          find ./artifacts/linux -name "*.deb" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-linux-amd64.deb" 2>/dev/null || true
          find ./artifacts/linux -name "*.rpm" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-linux-x86_64.rpm" 2>/dev/null || true
          find ./artifacts/linux -name "*.AppImage" -type f | head -n1 | \
            xargs -I{} cp {} "./artifacts/out/Local-Share-${TAG}-linux-x86_64.AppImage" 2>/dev/null || true

          echo "=== Final release assets ==="
          ls -la ./artifacts/out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: ./artifacts/out/*
          draft: false
          prerelease: false
          body_path: release_notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
